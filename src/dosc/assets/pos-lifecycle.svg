<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title description">
  <title id="title">Vòng đời vận hành SaaS POS</title>
  <desc id="description">Từ xác thực đến thiết lập cửa hàng, bán hàng và báo cáo ca.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#64748b"/>
    </marker>
    <style>
      .heading { font: 700 31px Arial, 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, 'Segoe UI', sans-serif; fill: #475569; }
      .step { font: 700 17px Arial, 'Segoe UI', sans-serif; fill: #0f172a; }
      .detail { font: 400 14px Arial, 'Segoe UI', sans-serif; fill: #475569; }
      .number { font: 700 14px Arial, 'Segoe UI', sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1440" height="560" rx="24" fill="url(#background)"/>
  <text x="720" y="65" text-anchor="middle" class="heading">Vòng đời vận hành SaaS POS</text>
  <text x="720" y="96" text-anchor="middle" class="subtitle">Từ tài khoản đến báo cáo ca — thể hiện theo các module hiện có trong mã nguồn</text>

  <path d="M 259 265 H 291" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 494 265 H 526" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 729 265 H 761" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 964 265 H 996" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1199 265 H 1231" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="55" y="178" width="204" height="174" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <circle cx="85" cy="208" r="17" fill="#0284c7"/><text x="85" y="213" text-anchor="middle" class="number">1</text>
    <text x="157" y="222" text-anchor="middle" class="step">Xác thực</text>
    <text x="157" y="255" text-anchor="middle" class="detail">Đăng ký hoặc đăng nhập</text>
    <text x="157" y="279" text-anchor="middle" class="detail">JWT + SecurityContext</text>
    <text x="157" y="320" text-anchor="middle" class="detail">Auth / User</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="178" width="204" height="174" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="320" cy="208" r="17" fill="#16a34a"/><text x="320" y="213" text-anchor="middle" class="number">2</text>
    <text x="392" y="222" text-anchor="middle" class="step">Thiết lập tenant</text>
    <text x="392" y="255" text-anchor="middle" class="detail">Tạo Store</text>
    <text x="392" y="279" text-anchor="middle" class="detail">Tạo Branch / nhân sự</text>
    <text x="392" y="320" text-anchor="middle" class="detail">Store / Branch / Employee</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="525" y="178" width="204" height="174" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <circle cx="555" cy="208" r="17" fill="#d97706"/><text x="555" y="213" text-anchor="middle" class="number">3</text>
    <text x="627" y="222" text-anchor="middle" class="step">Chuẩn bị bán hàng</text>
    <text x="627" y="255" text-anchor="middle" class="detail">Danh mục và sản phẩm</text>
    <text x="627" y="279" text-anchor="middle" class="detail">Tồn kho theo branch</text>
    <text x="627" y="320" text-anchor="middle" class="detail">Catalog / Inventory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="178" width="204" height="174" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <circle cx="790" cy="208" r="17" fill="#7c3aed"/><text x="790" y="213" text-anchor="middle" class="number">4</text>
    <text x="862" y="222" text-anchor="middle" class="step">Mở ca</text>
    <text x="862" y="255" text-anchor="middle" class="detail">Thu ngân hiện tại</text>
    <text x="862" y="279" text-anchor="middle" class="detail">Branch hiện tại</text>
    <text x="862" y="320" text-anchor="middle" class="detail">ShiftReport</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="995" y="178" width="204" height="174" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
    <circle cx="1025" cy="208" r="17" fill="#e11d48"/><text x="1025" y="213" text-anchor="middle" class="number">5</text>
    <text x="1097" y="222" text-anchor="middle" class="step">Bán và hoàn tiền</text>
    <text x="1097" y="255" text-anchor="middle" class="detail">Tạo Order từ giá DB</text>
    <text x="1097" y="279" text-anchor="middle" class="detail">Refund khi cần</text>
    <text x="1097" y="320" text-anchor="middle" class="detail">Order / Refund</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1230" y="178" width="154" height="174" rx="18" fill="#ffffff" stroke="#a5f3fc" stroke-width="2"/>
    <circle cx="1260" cy="208" r="17" fill="#0891b2"/><text x="1260" y="213" text-anchor="middle" class="number">6</text>
    <text x="1307" y="222" text-anchor="middle" class="step">Tổng kết</text>
    <text x="1307" y="255" text-anchor="middle" class="detail">Đóng ca</text>
    <text x="1307" y="279" text-anchor="middle" class="detail">Sales / refund</text>
    <text x="1307" y="320" text-anchor="middle" class="detail">Báo cáo</text>
  </g>

  <rect x="180" y="408" width="1080" height="74" rx="14" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="720" y="439" text-anchor="middle" class="step">Điểm kiểm soát cần bổ sung trước production</text>
  <text x="720" y="465" text-anchor="middle" class="detail">Phân quyền theo tenant · kiểm tra tồn kho / ca mở · liên kết refund với ca · chốt thời gian đóng ca</text>
</svg>
