

spring.application.name=SaaS-POS-Application

server.port=${SERVER_PORT:5000}

# A local run uses the disposable development schema. Docker and deployment
# provide DB_URL explicitly, so they remain pinned to their configured schema.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sass_pos_dev}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

#app.jwt.secret=${JWT_SECRET}
#app.jwt.expiration-ms=${JWT_EXPIRATION_MS:8400000}
app.jwt.secret=your-super-secret-jwt-key-for-saas-pos-2026
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.inventory.transfer-min-reserve=${INVENTORY_TRANSFER_MIN_RESERVE:5}

# Stripe Billing remains disabled until the environment contains real secret,
# webhook and recurring Price IDs. No credentials are committed to source.
app.stripe.enabled=${STRIPE_ENABLED:false}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.basic-price-id=${STRIPE_BASIC_PRICE_ID:}
app.stripe.pro-price-id=${STRIPE_PRO_PRICE_ID:}
app.stripe.app-url=${STRIPE_APP_URL:http://localhost:3000}

server.error.include-stacktrace=never
server.error.include-message=never
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
